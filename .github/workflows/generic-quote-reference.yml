name: Generic quote legacy reference

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/generic-quote-proof-gates.md'
      - '.github/workflows/generic-quote-reference.yml'
  push:
    paths:
      - 'backend/**'
      - 'docs/generic-quote-proof-gates.md'
      - '.github/workflows/generic-quote-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generic-quote-reference-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  legacy-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Verify frozen application sources without starting a database
        run: python backend/tests/reference/run_generic_quote_reference.py --verify-only
      - name: Verify the preinstalled PostgreSQL 16 tools
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/lib/postgresql/16/bin/pg_ctl
          reference_pg_version=$(/usr/lib/postgresql/16/bin/pg_ctl --version)
          [[ "$reference_pg_version" == 'pg_ctl (PostgreSQL) 16.'* ]]
          printf '%s\n' "$reference_pg_version" | tee "$RUNNER_TEMP/generic-reference-postgres-version.txt"
      - name: Install the existing locked reference dependencies
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.lock
      - name: Lint only the new reference harness
        run: python -m ruff check backend/tests/reference
      - name: Run the actual legacy ASGI app with isolated migrated PostgreSQL
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=75s 420s python backend/tests/reference/run_generic_quote_reference.py \
            --postgres-bin /usr/lib/postgresql/16/bin \
            --output "$RUNNER_TEMP/generic-quote-reference-report.json"
      - name: Retain only the sanitized reference report and server version
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-quote-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/generic-quote-reference-report.json
            ${{ runner.temp }}/generic-reference-postgres-version.txt
          if-no-files-found: error
          retention-days: 14
