name: Catalogue RFQ browser regression
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/catalog-rfq.yml'
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/catalog-rfq.yml'
permissions:
  contents: read
jobs:
  rfq-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alageum_rfq_ci
          POSTGRES_USER: alageum
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alageum -d alageum_rfq_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      APP_DATABASE_URL: postgresql+asyncpg://alageum:ci-password@localhost:5432/alageum_rfq_ci
      APP_SECRET_KEY: ci-only-catalogue-rfq-secret-not-for-deployment
      APP_LOCAL_STORAGE_PATH: /tmp/alageum-rfq-ci-storage
      APP_CORS_ORIGINS: '["http://127.0.0.1:3140"]'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8015/api/v1
      NEXT_PUBLIC_CATALOG_SOURCE: static
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_BASE_URL: http://127.0.0.1:3140
      E2E_QUOTES_BASE_URL: http://127.0.0.1:3140
      E2E_API_URL: http://127.0.0.1:8015/api/v1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked backend dependencies
        timeout-minutes: 4
        run: pip install -r backend/requirements-dev.lock
      - name: Install locked frontend dependencies
        timeout-minutes: 4
        working-directory: frontend
        run: npm ci
      - name: Install Chromium with bounded timeout
        timeout-minutes: 4
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prepare disposable migrated database
        timeout-minutes: 3
        working-directory: backend
        run: |
          alembic upgrade head
          python -m scripts.seed
          python -m scripts.import_catalog --catalog-dir ../docs/catalog-import
      - name: Build production frontend
        timeout-minutes: 5
        working-directory: frontend
        run: npm run build
      - name: Verify desktop/mobile interruptions and real authenticated persistence
        timeout-minutes: 8
        shell: bash
        run: |
          (cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8015) > rfq-api.log 2>&1 &
          api_pid=$!
          (cd frontend && npm run start -- --hostname 127.0.0.1 --port 3140) > rfq-frontend.log 2>&1 &
          web_pid=$!
          cleanup() {
            kill "${api_pid}" "${web_pid}" 2>/dev/null || true
            wait "${api_pid}" "${web_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          deadline=$((SECONDS + 90))
          until curl --fail --silent --connect-timeout 2 --max-time 5 "${E2E_API_URL}/readiness" > /dev/null \
            && curl --fail --silent --connect-timeout 2 --max-time 5 "${E2E_BASE_URL}/inquiry?source=api" > /dev/null; do
            if ! kill -0 "${api_pid}" || ! kill -0 "${web_pid}" || (( SECONDS >= deadline )); then
              tail -80 rfq-api.log rfq-frontend.log
              exit 1
            fi
            sleep 2
          done
          cd frontend
          npm run test:e2e:quotes -- --max-failures=3
          npm run test:e2e -- e2e/security.spec.js --workers=1 --max-failures=1
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-rfq-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
            rfq-api.log
            rfq-frontend.log
          retention-days: 7
